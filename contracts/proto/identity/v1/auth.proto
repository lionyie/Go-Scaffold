syntax = "proto3";

package identity.v1;

option go_package = "github.com/example/scaffold/services/api/identity/v1;identityv1";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "identity/v1/user.proto";

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/login"
      body: "*"
    };
  }
  rpc Refresh(RefreshRequest) returns (RefreshResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/refresh"
      body: "*"
    };
  }
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/logout"
      body: "*"
    };
  }
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse) {
    option (google.api.http) = { get: "/api/v1/auth/me" };
  }
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/password"
      body: "*"
    };
  }
}

message LoginRequest {
  string username = 1 [(google.api.field_behavior) = REQUIRED];
  string password = 2 [(google.api.field_behavior) = REQUIRED];
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  string token_type = 3;
  int32 expires_in = 4;
  User user = 5;
}

message RefreshRequest {
  string refresh_token = 1 [(google.api.field_behavior) = REQUIRED];
}

message RefreshResponse {
  string access_token = 1;
  string refresh_token = 2;
  string token_type = 3;
  int32 expires_in = 4;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}

message GetCurrentUserRequest {}

message GetCurrentUserResponse {
  User user = 1;
  repeated string permissions = 2;
}

message ChangePasswordRequest {
  string old_password = 1 [(google.api.field_behavior) = REQUIRED];
  string new_password = 2 [(google.api.field_behavior) = REQUIRED];
}

message ChangePasswordResponse {}
