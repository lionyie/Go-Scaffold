syntax = "proto3";

package common.v1;

option go_package = "github.com/example/scaffold/services/api/common/v1;commonv1";

// ErrorReason is the stable machine-readable reason attached to every API
// error. Clients translate these codes; messages may change.
enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;
  UNAUTHORIZED = 1;
  FORBIDDEN = 2;
  INVALID_CREDENTIALS = 3;
  TOKEN_INVALID = 4;
  TOKEN_EXPIRED = 5;
  USER_NOT_FOUND = 6;
  USER_ALREADY_EXISTS = 7;
  ROLE_NOT_FOUND = 8;
  ROLE_ALREADY_EXISTS = 9;
  PLUGIN_NOT_FOUND = 13;
  STORAGE_UNAVAILABLE = 14;
  STORAGE_FORBIDDEN = 15;
  INTERNAL_ERROR = 16;
  INVALID_ARGUMENT = 17;
  MUST_CHANGE_PASSWORD = 18;
}
