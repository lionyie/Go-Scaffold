# Optional Keycloak (OIDC) stack. Merge on top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.keycloak.yml up
#
# The core scaffold does not require Keycloak; this file only adds it as an
# opt-in identity provider.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "admin"
      KC_HOSTNAME: "localhost"
      KC_HTTP_ENABLED: "true"
      KC_HTTPS_ENABLED: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ../keycloak:/opt/keycloak/data/import:ro

  server:
    environment:
      SCAFFOLD_OAUTH_STATE_SECRET: "change-me-oauth-state"
      SCAFFOLD_OAUTH_OIDC_ISSUER: "http://localhost:8080/realms/scaffold"
      SCAFFOLD_OAUTH_OIDC_CLIENT_ID: "scaffold-admin"
      SCAFFOLD_OAUTH_OIDC_CLIENT_SECRET: "dev-scaffold-admin-secret"
      SCAFFOLD_OAUTH_OIDC_SCOPES: "openid email profile"
      SCAFFOLD_OAUTH_OIDC_DISPLAY_NAME: "Keycloak"
      SCAFFOLD_OAUTH_AUTO_REGISTER: "true"
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      keycloak:
        condition: service_started
